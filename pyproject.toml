[project]
name = "fleetflow"
version = "0.1.0"
description = "Connected EV telemetry and predictive health lakehouse portfolio project"
requires-python = ">=3.13"
dependencies = [
    "pandas",
    "psycopg[binary]",
    "python-dotenv"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require external services such as PostgreSQL"
]